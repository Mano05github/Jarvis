schema_version = "1.0"

[policy]
protected_floor_mib = 4096
soft_floor_mib = 5120
emergency_floor_mib = 3584
commit_reserve_mib = 1024
safety_multiplier = 1.25
maximum_heavy_workers = 1
queue_limit = 2
queue_timeout_seconds = 15.0
monitor_interval_seconds = 0.5
recovery_hysteresis_seconds = 30.0

# Only certified profiles may receive a runtime lease. The speech and local-LLM
# values are provisional until their repeatable peak-memory certification passes.
[[workers]]
name = "windows-broker"
certified = true
peak_private_mib = 256
hard_process_limit_mib = 384
hard_job_limit_mib = 384
active_process_limit = 1
heavy = false
evictable = false
eviction_rank = 100
idle_timeout_seconds = 300.0

