[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Windows-first, local-privacy-first embodied personal assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "psutil>=6.1,<8",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
benchmark = [
  "jiwer>=3.1,<5",
  "numpy>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --basetemp=storage/temp/pytest-shared -q"
cache_dir = "storage/cache/pytest"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jarvis"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
exclude = [
  ".venv",
  ".pytest_cache",
  "artifacts",
  "assets",
  "deliverables",
  "storage",
  "tools/generate_jarvis_deliverables.py",
]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jarvis"]

