name: phase-1-quality

on:
  push:
  pull_request:

jobs:
  windows-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run jarvis storage-init
      - run: cmake -S native/Jarvis.SpeechRuntime -B storage/build/native/Jarvis.SpeechRuntime
      - run: cmake --build storage/build/native/Jarvis.SpeechRuntime --config Release --parallel 4
      - run: ctest --test-dir storage/build/native/Jarvis.SpeechRuntime -C Release --output-on-failure
      - run: dotnet build native/Jarvis.WindowsBroker/Jarvis.WindowsBroker.csproj --configuration Release --nologo --configfile NuGet.Config
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=xml

